# cbindgen configuration for amber-ffi
# Generates AmberNative.h — the C header consumed by Swift via XCFramework.

language = "C"

# Use the crate's own include guard
include_guard = "AMBER_NATIVE_H"
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not modify. */"
tab_width = 4
style = "both"

[export]
include = [
    "amber_free_string",
    "amber_free_bytes",
    "amber_markdown_parse",
    "amber_markdown_to_html",
    "amber_markdown_preprocess",
    "amber_highlight",
    "amber_highlight_supported_languages",
    "amber_html_diff_normalize",
    "amber_reader_extract",
    "amber_parse_docx",
    "amber_parse_pptx",
    "amber_parse_epub",
    "amber_parse_xlsx",
    "amber_regex_apply",
    "amber_pbkdf2_hmac_sha256",
    "amber_aes_gcm_encrypt",
    "amber_aes_gcm_decrypt",
    "amber_sha256",
    "amber_hmac_sha256",
    "amber_json_expr_evaluate",
    "amber_json_expr_is_valid",
    "amber_tokenizer_count",
]

[fn]
# No prefix needed — function names already carry the amber_ prefix.

[struct]
# No structs are exported — all I/O is via raw C types.
