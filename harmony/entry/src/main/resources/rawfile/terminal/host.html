<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="xterm.css">
  <link rel="stylesheet" href="host.css">
</head>
<body>
  <div id="terminal" aria-label="Remote SSH 交互终端"></div>
  <div id="terminal-toolbar" role="toolbar" aria-label="终端工具键">
    <button id="terminal-keyboard" type="button" disabled>键盘</button>
    <button type="button" data-terminal-key="escape" disabled>Esc</button>
    <button type="button" data-terminal-key="tab" disabled>Tab</button>
    <button type="button" data-terminal-key="interrupt" disabled>Ctrl-C</button>
    <button type="button" data-terminal-key="up" aria-label="上方向键" disabled>↑</button>
    <button type="button" data-terminal-key="down" aria-label="下方向键" disabled>↓</button>
    <button type="button" data-terminal-key="left" aria-label="左方向键" disabled>←</button>
    <button type="button" data-terminal-key="right" aria-label="右方向键" disabled>→</button>
    <button type="button" data-terminal-key="enter" aria-label="回车" disabled>↵</button>
  </div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="host.js"></script>
</body>
</html>
