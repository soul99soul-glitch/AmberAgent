name: Android Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager --install "platforms;android-36" "platforms;android-37.0" \
            "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust and Android target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 3.5.4

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-${{ runner.arch }}-android-cargo-1.95.0-ndk27-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml', 'native/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-android-cargo-1.95.0-ndk27-

      - name: Prepare signed build files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          : "${KEY_BASE64:?Missing KEY_BASE64 secret}"
          : "${SIGNING_CONFIG:?Missing SIGNING_CONFIG secret}"
          : "${GOOGLE_SERVICES_JSON:?Missing GOOGLE_SERVICES_JSON secret}"
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Gradle release build
        # assembleFullRelease also verifies all eight required Rust libraries in
        # every APK. `surface` flavors: release publishes the canonical `full`
        # product only; standalone flavors (novel/deepread) build locally.
        run: ./gradlew :app:assembleFullRelease -PuploadCrashlyticsMapping=false --no-daemon --console=plain

      - name: Verify release APK signatures
        run: |
          set -euo pipefail
          for APK in app/build/outputs/apk/full/release/*.apk; do
            "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "$APK"
          done

      - name: Remove signed build files
        if: always()
        run: rm -f app/app.key local.properties app/google-services.json

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed APKs
        uses: actions/download-artifact@v8
        with:
          name: android-release-apk
          path: release-apks

      - name: Publish Android prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="android-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          printf 'Android 签名 Release APK（ARM64），由 main 自动构建。\n\nCommit: %s\nBuild: %s/%s/actions/runs/%s\n\n下载任意一个 APK 安装；universal 包目前也仅支持 ARM64。\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.md
          gh release create "$TAG" release-apks/*.apk \
            --target "$GITHUB_SHA" \
            --title "AmberAgent Android build ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md \
            --prerelease --latest=false
