name: AmberAgent
options:
  bundleIdPrefix: app.amber.ios
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amber.ios
        INFOPLIST_FILE: iosApp/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64"
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64-sim"
    dependencies:
      # Shared KMP framework (built by ./gradlew :shared:linkDebugFrameworkIosArm64)
      - framework: ../shared/build/bin/iosArm64/debugFramework/Shared.framework
        embed: false
      # AmberNative XCFramework (Rust FFI)
      - framework: ../native/AmberNative.xcframework/ios-arm64/AmberNative.framework
        embed: false
    scheme:
      configVariants:
        - Debug
        - Release
      gatherCoverageData: false
