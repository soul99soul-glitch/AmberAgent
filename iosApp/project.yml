name: AmberAgent
options:
  bundleIdPrefix: app.amber.ios
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

configs:
  Debug: debug
  Release: release

packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    exactVersion: 0.13.0

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    preBuildScripts:
      - name: Validate Entitlement Diagnostics
        basedOnDependencyAnalysis: false
        script: |
          /bin/sh "${SRCROOT}/scripts/validate-entitlement-diagnostics.sh" "${SRCROOT}/iosApp/AmberAgent.entitlements" "${SRCROOT}/iosApp/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amber.ios
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/AmberAgent.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS:
          - iphoneos
          - iphonesimulator
        FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64-sim"
        FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
          - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64"
        OTHER_LDFLAGS:
          - "-lamber_ffi"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS:
          - "$(inherited)"
          - "STABLE_TERMINAL_RUNTIMES"
        HEADER_SEARCH_PATHS[sdk=iphonesimulator*]:
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64-sim/Headers"
        HEADER_SEARCH_PATHS[sdk=iphoneos*]:
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64/Headers"
    dependencies:
      - framework: Shared.framework
        embed: true
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio-ssh
        product: NIOSSH
      - target: AmberAgentActivityWidget
    scheme:
      gatherCoverageData: false
      testTargets:
        - iosAppTests
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iosAppTests
    dependencies:
      - target: iosApp
      - framework: Shared.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amber.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iosApp.app/iosApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64-sim"
        FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
          - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64"
        HEADER_SEARCH_PATHS[sdk=iphonesimulator*]:
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64-sim/Headers"
        HEADER_SEARCH_PATHS[sdk=iphoneos*]:
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64/Headers"
        OTHER_LDFLAGS:
          - "-lamber_ffi"
        SUPPORTED_PLATFORMS:
          - iphoneos
          - iphonesimulator
  AmberAgentActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ActivityWidget
      - path: iosApp/AgentActivityModels.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amber.ios.activity
        INFOPLIST_FILE: ActivityWidget/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SUPPORTED_PLATFORMS:
          - iphoneos
          - iphonesimulator
  AmberAgentActivityWidgetExperimentalGPL:
    type: app-extension
    platform: iOS
    sources:
      - path: ActivityWidget
      - path: iosApp/AgentActivityModels.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amber.ios.experimental-gpl.activity
        INFOPLIST_FILE: ActivityWidget/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SUPPORTED_PLATFORMS:
          - iphoneos
          - iphonesimulator
  iosAppExperimentalGPL:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    preBuildScripts:
      - name: Validate Entitlement Diagnostics
        basedOnDependencyAnalysis: false
        script: |
          /bin/sh "${SRCROOT}/scripts/validate-entitlement-diagnostics.sh" "${SRCROOT}/iosApp/AmberAgent.entitlements" "${SRCROOT}/iosApp/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amber.ios.experimental-gpl
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/AmberAgent.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS:
          - iphoneos
          - iphonesimulator
        FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64-sim"
        FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
          - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64"
        OTHER_LDFLAGS:
          - "-lamber_ffi"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS:
          - "$(inherited)"
          - "ENABLE_EXPERIMENTAL_TERMINAL_RUNTIMES"
        HEADER_SEARCH_PATHS[sdk=iphonesimulator*]:
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64-sim/Headers"
        HEADER_SEARCH_PATHS[sdk=iphoneos*]:
          - "$(SRCROOT)/../native/AmberNative.xcframework/ios-arm64/Headers"
    dependencies:
      - framework: Shared.framework
        embed: true
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio-ssh
        product: NIOSSH
      - target: AmberAgentActivityWidgetExperimentalGPL
    scheme:
      gatherCoverageData: false
